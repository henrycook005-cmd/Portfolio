<!doctype html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef0ef; --ink:#151819; --muted:#5b6467; --line:#d4d9d8; --tile:#dfe3e2; --over:rgba(12,14,15,.96);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#121415; --ink:#e9ecea; --muted:#949d9f; --line:#2a2f31; --tile:#1d2123; color-scheme:dark;}
}
:root[data-theme="dark"]{--paper:#121415; --ink:#e9ecea; --muted:#949d9f; --line:#2a2f31; --tile:#1d2123; color-scheme:dark;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit}

.hero{position:relative;height:min(92vh,980px);min-height:480px;overflow:hidden;background:#222}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.6) 100%),linear-gradient(90deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 55%)}
.hero .name{text-shadow:0 2px 28px rgba(0,0,0,.35);position:absolute;left:clamp(20px,4vw,56px);right:clamp(20px,4vw,56px);bottom:clamp(24px,5vw,64px);z-index:1;color:#fff}
.hero h1{margin:0;font-weight:700;font-size:clamp(56px,13vw,200px);line-height:.86;letter-spacing:-.045em;font-variation-settings:"opsz" 96}
.hero p{margin:14px 0 0 4px;font-size:clamp(16px,1.6vw,20px);opacity:.92;max-width:34ch}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
nav .in{max-width:1680px;margin:0 auto;padding:0 clamp(16px,3vw,40px);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav .in::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;padding:16px 12px;color:var(--muted);font-variant-numeric:tabular-nums;border-bottom:2px solid transparent;margin-bottom:-1px}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink);border-bottom-color:var(--ink)}
nav .who{white-space:nowrap;margin-right:auto;padding:16px 12px 16px 0;font-weight:700;color:var(--ink);letter-spacing:-.01em}

main{max-width:1680px;margin:0 auto;padding:0 clamp(16px,3vw,40px) 64px}
section{padding-top:clamp(40px,6vw,88px)}
.yr{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 clamp(16px,2vw,28px);border-bottom:1px solid var(--line);padding-bottom:10px}
.yr h2{margin:0;font-size:clamp(44px,8vw,128px);font-weight:700;letter-spacing:-.045em;line-height:.92}
.yr span{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;margin-bottom:10px}
.row button{flex:var(--a) 1 0;min-width:0;padding:0;border:0;background:var(--tile);cursor:zoom-in;overflow:hidden;border-radius:2px}
.row img{display:block;width:100%;height:100%;object-fit:cover;aspect-ratio:var(--a);transition:opacity .25s}
.row.feat{margin:clamp(14px,2.4vw,36px) 0}
.row.feat button{flex:1}
.row.feat img{aspect-ratio:auto;max-height:88vh;height:auto}
.row button:hover img{opacity:.88}
.row button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
section + section{margin-top:clamp(24px,5vw,72px)}

footer{max-width:1680px;margin:0 auto;padding:32px clamp(16px,3vw,40px) 48px;border-top:1px solid var(--line);color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

.lb{position:fixed;inset:0;z-index:20;background:var(--over);display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 12px calc(env(safe-area-inset-bottom,0px) + 56px)}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain;user-select:none}
.lb button{position:absolute;border:0;background:transparent;color:#fff;font:inherit;font-size:28px;line-height:1;padding:14px 18px;cursor:pointer;opacity:.8}
.lb button:hover,.lb button:focus-visible{opacity:1}
.lb .x{top:calc(env(safe-area-inset-top,0px) + 4px);right:6px}
.lb .p{left:4px;top:50%;transform:translateY(-50%)}
.lb .n{right:4px;top:50%;transform:translateY(-50%)}
.lb .c{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;text-align:center;color:#c9cfd0;font-size:15px;font-variant-numeric:tabular-nums}
@media (max-width:640px){nav .who{display:none}.lb .p,.lb .n{display:none}.row{gap:6px;margin-bottom:6px}.row.feat{margin:12px 0}}
</style>
</head>
<body>
<header class="hero">
  <img src="photos-1/2023-047.jpg" alt="White boat on turquoise water" fetchpriority="high">
  <div class="name"><h1>Henry<br>Cook</h1><p>Photographs from the road.</p></div>
</header>
<nav aria-label="Places"><div class="in" id="nav"><span class="who">Henry Cook</span></div></nav>
<main id="main"></main>
<footer><span>© <span id="yr"></span> Henry Cook. All photographs by me.</span><span>Shot mostly on a Canon EOS Rebel T7.</span></footer>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <img id="lbi" alt="">
  <button class="x" id="lx" aria-label="Close">✕</button>
  <button class="p" id="lp" aria-label="Previous photo">‹</button>
  <button class="n" id="ln" aria-label="Next photo">›</button>
  <div class="c" id="lc"></div>
</div>
<script>
const PHOTOS=[{"name":"Europe","rows":[{"feat":1,"p":[{"src":"photos-2/2024-063.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-1/2022-011.jpg","w":1600,"h":1066},{"src":"photos-1/2022-012.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-1/2022-013.jpg","w":1600,"h":1145},{"src":"photos-1/2022-014.jpg","w":1600,"h":1000},{"src":"photos-1/2022-015.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-1/2022-016.jpg","w":1600,"h":1066},{"src":"photos-1/2022-021.jpg","w":1600,"h":1066}]},{"feat":1,"p":[{"src":"photos-1/2023-050.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-1/2022-025.jpg","w":1600,"h":1066},{"src":"photos-1/2022-026.jpg","w":1600,"h":1097},{"src":"photos-1/2022-027.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-1/2022-028.jpg","w":1600,"h":1066},{"src":"photos-1/2022-029.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-1/2022-030.jpg","w":1600,"h":1066},{"src":"photos-1/2022-031.jpg","w":1600,"h":1066},{"src":"photos-1/2022-032.jpg","w":1600,"h":1118}]},{"feat":1,"p":[{"src":"photos-2/2026-077.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-1/2023-048.jpg","w":1600,"h":1066},{"src":"photos-1/2023-049.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-2/2023-054.jpg","w":1600,"h":1066},{"src":"photos-2/2023-055.jpg","w":1600,"h":1066},{"src":"photos-2/2023-056.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-2/2024-062.jpg","w":1600,"h":1066},{"src":"photos-2/2024-064.jpg","w":1600,"h":1066}]},{"feat":1,"p":[{"src":"photos-2/2024-066.jpg","w":1600,"h":1163}]},{"feat":0,"p":[{"src":"photos-2/2024-065.jpg","w":1600,"h":1066},{"src":"photos-2/2024-067.jpg","w":1600,"h":1066},{"src":"photos-2/2026-078.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-2/2026-079.jpg","w":1600,"h":1066},{"src":"photos-2/2026-080.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-2/2026-081.jpg","w":1600,"h":1066},{"src":"photos-2/2026-082.jpg","w":1600,"h":1066},{"src":"photos-2/2026-083.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-2/2026-084.jpg","w":1600,"h":1066},{"src":"photos-2/2026-085.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-2/2026-086.jpg","w":1600,"h":1066},{"src":"photos-2/2026-087.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-2/2026-088.jpg","w":1600,"h":1066},{"src":"photos-2/2026-089.jpg","w":1600,"h":1066}]}]},{"name":"Asia","rows":[{"feat":1,"p":[{"src":"photos-1/2022-018.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-1/2022-017.jpg","w":1600,"h":1043},{"src":"photos-1/2022-019.jpg","w":1600,"h":1113}]},{"feat":0,"p":[{"src":"photos-1/2022-020.jpg","w":1600,"h":1066},{"src":"photos-1/2022-022.jpg","w":1600,"h":1128},{"src":"photos-1/2022-023.jpg","w":1600,"h":1066}]},{"feat":1,"p":[{"src":"photos-1/2023-052.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-1/2022-024.jpg","w":1600,"h":1066},{"src":"photos-1/2022-033.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-1/2023-039.jpg","w":1600,"h":926},{"src":"2023-041.jpg","w":1600,"h":1066},{"src":"2023-042.jpg","w":1600,"h":1066}]},{"feat":1,"p":[{"src":"2023-040.jpg","w":1600,"h":1009}]},{"feat":0,"p":[{"src":"photos-1/2023-043.jpg","w":1600,"h":1066},{"src":"photos-1/2023-044.jpg","w":1600,"h":1107}]},{"feat":0,"p":[{"src":"photos-1/2023-045.jpg","w":1600,"h":1066},{"src":"photos-1/2023-051.jpg","w":1600,"h":1066},{"src":"photos-2/2023-053.jpg","w":1600,"h":1066}]},{"feat":1,"p":[{"src":"photos-2/2026-097.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-2/2026-092.jpg","w":1600,"h":1066},{"src":"photos-2/2026-093.jpg","w":1600,"h":1063}]},{"feat":0,"p":[{"src":"photos-2/2026-094.jpg","w":1600,"h":1066},{"src":"photos-2/2026-095.jpg","w":1600,"h":1066},{"src":"photos-2/2026-096.jpg","w":1600,"h":1066}]}]},{"name":"North America","rows":[{"feat":1,"p":[{"src":"photos-2/misc-001.jpg","w":1068,"h":608}]},{"feat":0,"p":[{"src":"photos-1/2021-002.jpg","w":1600,"h":1067},{"src":"photos-1/2021-003.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-1/2021-004.jpg","w":1600,"h":1066},{"src":"photos-1/2021-005.jpg","w":1600,"h":1066},{"src":"photos-1/2021-006.jpg","w":1600,"h":962}]},{"feat":0,"p":[{"src":"photos-1/2021-007.jpg","w":1600,"h":1066},{"src":"photos-1/2021-008.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-1/2021-009.jpg","w":1600,"h":1066},{"src":"photos-1/2022-010.jpg","w":1600,"h":1078},{"src":"photos-1/2023-035.jpg","w":1600,"h":1066}]},{"feat":1,"p":[{"src":"photos-1/2023-034.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-1/2023-036.jpg","w":1600,"h":1066},{"src":"photos-1/2023-037.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-1/2023-038.jpg","w":1600,"h":1066},{"src":"photos-1/2023-046.jpg","w":1600,"h":1066},{"src":"photos-1/2023-047.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-2/2024-057.jpg","w":1600,"h":1066},{"src":"photos-2/2024-072.jpg","w":1600,"h":871}]},{"feat":0,"p":[{"src":"photos-2/2024-073.jpg","w":1600,"h":1066},{"src":"photos-2/2026-074.jpg","w":1600,"h":1066}]},{"feat":1,"p":[{"src":"photos-2/2026-075.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-2/2026-076.jpg","w":1600,"h":1066},{"src":"photos-2/2026-090.jpg","w":1600,"h":1066},{"src":"photos-2/2026-091.jpg","w":1600,"h":1066}]}]},{"name":"South America","rows":[{"feat":1,"p":[{"src":"photos-2/2024-071.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-2/2024-068.jpg","w":1600,"h":1066},{"src":"photos-2/2024-069.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-2/2024-070.jpg","w":1600,"h":1066},{"src":"photos-2/2024-a03.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-2/2024-a04.jpg","w":1600,"h":1129},{"src":"photos-2/2024-a05.jpg","w":1600,"h":1066}]}]},{"name":"Oceania","rows":[{"feat":1,"p":[{"src":"photos-2/2024-059.jpg","w":1600,"h":1048}]},{"feat":0,"p":[{"src":"photos-2/2024-a01.jpg","w":1600,"h":1200},{"src":"photos-2/2024-a02.jpg","w":1600,"h":1066}]},{"feat":0,"p":[{"src":"photos-2/2024-058.jpg","w":1600,"h":1108},{"src":"photos-2/2024-060.jpg","w":1600,"h":1066},{"src":"photos-2/2024-061.jpg","w":1600,"h":1200}]}]}];
document.getElementById('yr').textContent=new Date().getFullYear();
const main=document.getElementById('main'), nav=document.getElementById('nav');
const flat=[];
const slug=t=>t.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const phone=matchMedia('(max-width:640px)');
PHOTOS.forEach(reg=>reg.rows.forEach(r=>r.p.forEach(p=>{p.i=flat.length;flat.push(p);})));
function rowsFor(reg){
  if(!phone.matches) return reg.rows;
  // On phones: only starred photos go full width; everything else is regrouped two-up (one three-up if the count is odd)
  const out=[]; let run=[];
  const flush=()=>{while(run.length){const n=run.length===3?3:2; out.push({feat:0,p:run.splice(0,n)});}};
  reg.rows.forEach(r=>{ if(r.feat){flush();out.push(r);} else run.push(...r.p); });
  flush(); return out;
}
function build(){
  main.innerHTML=''; nav.querySelectorAll('a').forEach(a=>a.remove());
  PHOTOS.forEach(reg=>{
    const s=document.createElement('section'); s.id=slug(reg.name);
    const n=reg.rows.reduce((c,r)=>c+r.p.length,0);
    s.innerHTML=`<div class="yr"><h2>${reg.name}</h2><span>${n} photos</span></div>`;
    rowsFor(reg).forEach(r=>{
      const row=document.createElement('div'); row.className='row'+(r.feat?' feat':'');
      r.p.forEach(p=>{
        const b=document.createElement('button'); b.setAttribute('aria-label','Open photo '+(p.i+1)); b.style.setProperty('--a',(p.w/p.h).toFixed(4));
        const im=document.createElement('img'); im.loading='lazy'; im.decoding='async'; im.alt=''; im.src=p.src; im.width=p.w; im.height=p.h;
        b.appendChild(im); b.onclick=()=>open(p.i); row.appendChild(b);
      });
      s.appendChild(row);
    });
    main.appendChild(s);
    const a=document.createElement('a'); a.href='#'+s.id; a.textContent=reg.name; nav.appendChild(a);
  });
}
build();
let links=[...nav.querySelectorAll('a')];
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle('on',l.getAttribute('href')==='#'+e.target.id));}})},{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('section').forEach(s=>io.observe(s));
phone.addEventListener('change',()=>{io.disconnect();build();links=[...nav.querySelectorAll('a')];document.querySelectorAll('section').forEach(s=>io.observe(s));});
const lb=document.getElementById('lb'), lbi=document.getElementById('lbi'), lc=document.getElementById('lc');
let cur=-1, last=null;
function show(){const p=flat[cur]; lbi.src=p.full||p.src; lc.textContent=`${cur+1} / ${flat.length}`; const nx=flat[(cur+1)%flat.length]; const pre=new Image(); pre.src=nx.full||nx.src;}
function open(i){last=document.activeElement; cur=i; lb.classList.add('open'); document.body.style.overflow='hidden'; show(); document.getElementById('lx').focus();}
function close(){lb.classList.remove('open'); document.body.style.overflow=''; cur=-1; last&&last.focus();}
function step(d){cur=(cur+d+flat.length)%flat.length; show();}
document.getElementById('lx').onclick=close;
document.getElementById('lp').onclick=e=>{e.stopPropagation();step(-1)};
document.getElementById('ln').onclick=e=>{e.stopPropagation();step(1)};
lb.onclick=e=>{if(e.target===lb)close();};
document.addEventListener('keydown',e=>{if(cur<0)return; if(e.key==='Escape')close(); else if(e.key==='ArrowRight')step(1); else if(e.key==='ArrowLeft')step(-1);});
let tx=null; lb.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',e=>{if(tx===null)return; const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>45)step(d<0?1:-1); tx=null;});
</script>

</html>
